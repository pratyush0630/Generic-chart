{{- if not .Values.statefulSet }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Values.namespace }}
  labels: 
    {{- include "app.labels" . | nindent 4 }} 
spec: 
  replicas: {{ .Values.replicas }}
  selector: 
    matchLabels: 
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "app.labels" . | nindent 4 }} 
    spec:
      {{- if .Values.affinity }}
      affinity: 
        {{- with .Values.affinity.podAntiAffinity }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ .keyValue }}
              topologyKey:  {{ .topologyKey }}
            weight: {{ .weight }}
        {{- end }}
        {{- if .Values.affinity.key }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ .Values.affinity.key }}
                operator: In
                values:
                - {{ .Values.affinity.value }}
        tolerations:
          - effect: NoSchedule
            key: {{ .Values.affinity.key }}
            operator: Equal
            value: {{ .Values.affinity.key }}
        {{- end }}
        {{- end }}

        containers:
          - name: {{ include "app.name" . }}
            image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
            imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
            {{- if .Values.workDir }}
            workingDir: {{ .Values.workDir }}
            {{- end }}
            {{- with .Values.command }}
            command: {{- range .Values.command }} 
              - {{ . | quote }}
            {{- end }}
            {{- with .Values.securityContext }}
            securityContext: {{ toYaml .values.securityContext | indent 12 }}
            {{- end }}
            {{- with .Values.args }}
            args: {{- range .Values.args }}
              - {{ . | quote }}
            {{- end }}
            {{- with .Values.service }}
            ports:
            - containerPort: {{ .Values.service.containerPort }}
              name: {{ include "app.name" . | trunc 15 }}
            {{- end }}
            envFrom: 
            {{- with .Values.configs }}  
            - configMapRef: 
                name: {{ include "app.name" . }}-config 
            {{ end }}
            {{- with .Values.secrets }} 
            - secretRef: 
                name: {{ include "app.name" . }}-secret
            {{ end }}

            {{- with .Values.probes }}
            livelinessProbe:
              httpGet: 
                path: {{ default "IfNotPresent" .Values.probes.livelinessPath }}
                port: {{ .Values.service.containerPort }}  
{{ toYaml .Values.probes.liveness | indent 12 }}
            readinessProbe: 
              httpGet: 
                path: {{ default .Values.probes.ReadinessPath }} 
                port: {{ .Values.servic.containerPort }}
{{ toYaml .Values.probes.liveness | indent 12 }}
            {{- end }}

            {{- with $.Values.resources }}
            resources: {{ toYaml . | indent 12 }} 
            {{- end }}

            {{- with .Values.volume }} 
            volumeMounts:
              - mountPath: {{ .Values.volumes.path }}
                name: data
            {{- end }}
            {{- end }}
            {{- with .Values.volumes }}
            volumes:
            {{- range .Values.volumes }}
              - name: {{ .name }}
            {{- if .persistentVolumeClaim }}
                persistentVolumeClaim:claimName: {{ .persistentVolumeClaim.claimName }}
            {{- end }}
            {{- if .configMap }}
                configMap:
                name: {{ .configMap.name }}
            {{- end }}
            {{- if .secret }}
                secret:
                secretName: {{ .secret.secretName }}
            {{- end }}
            {{- if .emptyDir }}
                emptyDir: {{ toYaml .emptyDir | nindent 6 }}
            {{- end }}
            {{- end }}
            {{- end }}
{{- end }}
{{- end }}